{% extends "core/base.html" %}
{% block title %}{{ post.title }} — Simalthali Agro Pvt. Ltd.{% endblock %}
{% block content %}
<section class="container section narrow">
    <a href="{% url 'blog_list' %}" class="back-link">&larr; Back to blog</a>
    <h1>{{ post.title }}</h1>
    <p class="muted">{{ post.published_date|date:"M d, Y" }}</p>
    {% if post.cover_image %}<img src="{{ post.cover_image.url }}" alt="{{ post.title }}" class="detail-img-full">{% endif %}
    <div class="blog-content">{{ post.content|linebreaks }}</div>
</section>
{% endblock %}
